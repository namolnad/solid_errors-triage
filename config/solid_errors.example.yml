# Copy to config/solid_errors.yml in the host app. Every key is optional; the
# defaults in SolidErrorsTriage::Configuration apply to anything left out.
#
# Solid Errors itself emails an error's first occurrence, and the occurrence that
# reopens it. These are the rules for every email after that.
notification_triggers:
  # "Resolved" closes the loop.
  lifecycle:
    resolved: true

  # Occurrence milestones, roughly logarithmic: the 2nd occurrence tells you
  # nothing the 1st didn't, but the 100th says this is now systemic.
  counts:
    - 10
    - 100
    - 1000

  # Fires once as the window is crossed, not on every occurrence after it, so a
  # loop erroring 10,000 times sends one email rather than 10,000.
  rate_threshold:
    count: 30
    window: 300 # seconds

# How long a resolved error is kept before SolidErrorsTriage::CleanupJob prunes
# it. Unset, the job does nothing.
destroy_resolved_after_days: 90
